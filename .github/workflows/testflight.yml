name: TestFlight

# Builds the iPad/iPhone app, signs it and uploads it to TestFlight.
# Started by hand from the Actions page. Needs these repository secrets:
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID   Apple Developer team ID
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit $missing
      - name: Write the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild -project iPad/SDVideoImport.xcodeproj -scheme SDVideoImport \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SDVideoImport.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet archive
      - name: Sign and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SDVideoImport.xcarchive" \
            -exportOptionsPlist iPad/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
