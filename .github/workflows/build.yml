name: Build

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the iPad app (simulator, no signing)
        run: |
          xcodebuild -project iPad/SDVideoImport.xcodeproj -scheme SDVideoImport \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build the Mac app bundle
        run: ./scripts/build-app.sh
      - name: Pack the app
        run: ditto -c -k --keepParent "build/iCloud Video Resize.app" build/iCloud-Video-Resize.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iCloud-Video-Resize
          path: build/iCloud-Video-Resize.zip
          retention-days: 14
