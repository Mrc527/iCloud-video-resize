[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-video-resize"
version = "0.1.0"
description = "Background service that re-encodes iCloud Photos videos to HEVC to save space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osxphotos>=0.68; sys_platform == 'darwin'",
    "photoscript>=0.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
icvr = "icloud_video_resize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
